name: Chasse Immo Gratuit

on:
  schedule:
    - cron: '0 7 * * *' # Tous les jours à 7h00
  workflow_dispatch: # Permet de lancer manuellement à tout moment

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer les dépendances
        run: pip install requests duckduckgo-search google-generativeai

      - name: Lancer le script Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agent.py
